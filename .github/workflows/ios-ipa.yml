name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || xcodebuild -version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web bundle and sync iOS project
        run: |
          [ -d ios ] || pnpm exec cap add ios
          pnpm build:ios

      - name: Archive with Xcode (unsigned)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Netfly.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package .ipa
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/Netfly.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/ipa/Payload/Netfly.app"
          cd "$RUNNER_TEMP/ipa" && zip -qry Netfly.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Netfly-ipa
          path: ${{ runner.temp }}/ipa/Netfly.ipa
